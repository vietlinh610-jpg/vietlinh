<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React CRUD - Quản lý người dùng</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Danh sách trường của form (dùng chung cho Thêm và Sửa)
    const FIELDS = [
      { id: "name", label: "Name" },
      { id: "username", label: "Username" },
      { id: "email", label: "Email" },
      { id: "street", label: "Street", nested: true },
      { id: "suite", label: "Suite", nested: true },
      { id: "city", label: "City", nested: true },
      { id: "phone", label: "Phone" },
      { id: "website", label: "Website" },
    ];
    const ADDRESS_FIELDS = ["street", "suite", "city"];
    const emptyUser = () => ({
      name: "", username: "", email: "",
      address: { street: "", suite: "", city: "" },
      phone: "", website: "",
    });

    // ========== App: giữ state dùng chung, truyền props xuống con ==========
    function App() {
      const [kw, setKeyword] = React.useState("");
      const [newUser, setNewUser] = React.useState(null);

      return (
        <div className="container">
          <h1>Quản lý người dùng</h1>
          <div className="toolbar">
            <SearchForm onChangeValue={setKeyword} />
            <AddUser onAdd={setNewUser} />
          </div>
          <ResultTable keyword={kw} user={newUser} onAdded={() => setNewUser(null)} />
        </div>
      );
    }

    // ========== SearchForm: con -> cha qua callback ==========
    function SearchForm({ onChangeValue }) {
      return (
        <input
          className="search-input"
          type="text"
          placeholder="Tìm theo name, username"
          onChange={(e) => onChangeValue(e.target.value)}
        />
      );
    }

    // ========== AddUser: form thêm (controlled component) ==========
    function AddUser({ onAdd }) {
      const [adding, setAdding] = React.useState(false);
      const [user, setUser] = React.useState(emptyUser());

      const handleChange = (e) => {
        const { id, value } = e.target;
        if (ADDRESS_FIELDS.includes(id)) {
          setUser({ ...user, address: { ...user.address, [id]: value } });
        } else {
          setUser({ ...user, [id]: value });
        }
      };

      const handleAdd = () => {
        if (user.name.trim() === "" || user.username.trim() === "") {
          alert("Vui lòng nhập Name và Username!");
          return;
        }
        onAdd(user);
        setUser(emptyUser());
        setAdding(false);
      };

      const handleCancel = () => {
        setUser(emptyUser());
        setAdding(false);
      };

      return (
        <div>
          <button className="btn-add" onClick={() => setAdding(true)}>Thêm</button>
          {adding && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h4>Thêm người dùng</h4>
                {FIELDS.map((f) => (
                  <div className="form-row" key={f.id}>
                    <label htmlFor={f.id}>{f.label}:</label>
                    <input
                      id={f.id}
                      type="text"
                      value={f.nested ? user.address[f.id] : user[f.id]}
                      onChange={handleChange}
                    />
                  </div>
                ))}
                <div className="modal-actions">
                  <button className="btn-save" onClick={handleAdd}>Thêm</button>
                  {/* Lỗi trong tài liệu: onClick={setAdding(false)} -> phải bọc trong arrow function */}
                  <button className="btn-cancel" onClick={handleCancel}>Hủy</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ========== ResultTable: đọc, lọc, sửa, xóa ==========
    function ResultTable({ keyword, user, onAdded }) {
      const [users, setUsers] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [error, setError] = React.useState(null);
      const [editing, setEditing] = React.useState(null);

      // READ: tải dữ liệu 1 lần khi component mount
      React.useEffect(() => {
        fetch("https://jsonplaceholder.typicode.com/users")
          .then((res) => res.json())
          .then((data) => { setUsers(data); setLoading(false); })
          .catch((err) => { setError(err.message); setLoading(false); });
      }, []);

      // CREATE: khi prop user thay đổi -> thêm vào danh sách
      React.useEffect(() => {
        if (user) {
          // Dùng id lớn nhất + 1 thay vì prev.length + 1 để tránh trùng id sau khi xóa
          setUsers((prev) => {
            const nextId = prev.reduce((max, u) => Math.max(max, u.id), 0) + 1;
            return [...prev, { ...user, id: nextId }];
          });
          onAdded();
        }
      }, [user]);

      // UPDATE: deep copy để không sửa trực tiếp dữ liệu gốc
      function editUser(u) {
        setEditing({ ...u, address: { ...u.address } });
      }

      function handleEditChange(field, value) {
        if (ADDRESS_FIELDS.includes(field)) {
          setEditing((prev) => ({ ...prev, address: { ...prev.address, [field]: value } }));
        } else {
          setEditing((prev) => ({ ...prev, [field]: value }));
        }
      }

      function saveUser() {
        if (editing.name.trim() === "" || editing.username.trim() === "") {
          alert("Vui lòng nhập Name và Username!");
          return;
        }
        setUsers((prev) => prev.map((u) => (u.id === editing.id ? editing : u)));
        setEditing(null);
      }

      // DELETE
      function removeUser(id) {
        setUsers((prev) => prev.filter((u) => u.id !== id));
      }

      const k = keyword.toLowerCase();
      const filteredUsers = users.filter(
        (u) => u.name.toLowerCase().includes(k) || u.username.toLowerCase().includes(k)
      );

      if (loading) return <p>Đang tải dữ liệu...</p>;
      if (error) return <p style={{ color: "#c62828" }}>Lỗi tải dữ liệu: {error}</p>;

      return (
        <div>
          <table>
            <thead>
              <tr>
                <th>ID</th><th>Name</th><th>Username</th><th>Email</th>
                <th>Address</th><th>Phone</th><th>Thao tác</th>
              </tr>
            </thead>
            <tbody>
              {filteredUsers.length === 0 && (
                <tr><td colSpan="7" className="empty">Không tìm thấy người dùng phù hợp</td></tr>
              )}
              {filteredUsers.map((u) => (
                <tr key={u.id}>
                  <td>{u.id}</td>
                  <td>{u.name}</td>
                  <td>{u.username}</td>
                  <td>{u.email}</td>
                  <td>{[u.address.street, u.address.suite, u.address.city].filter(Boolean).join(", ")}</td>
                  <td>{u.phone}</td>
                  <td style={{ whiteSpace: "nowrap" }}>
                    <button className="btn-edit" onClick={() => editUser(u)}>Sửa</button>
                    <button className="btn-delete" onClick={() => removeUser(u.id)}>Xóa</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>

          {editing && (
            <div className="modal-overlay">
              <div className="modal-content">
                <h4>Sửa người dùng #{editing.id}</h4>
                {FIELDS.map((f) => (
                  <div className="form-row" key={f.id}>
                    <label htmlFor={"edit-" + f.id}>{f.label}:</label>
                    <input
                      id={"edit-" + f.id}
                      type="text"
                      value={(f.nested ? editing.address[f.id] : editing[f.id]) ?? ""}
                      onChange={(e) => handleEditChange(f.id, e.target.value)}
                    />
                  </div>
                ))}
                <div className="modal-actions">
                  <button className="btn-save" onClick={saveUser}>Lưu</button>
                  <button className="btn-cancel" onClick={() => setEditing(null)}>Hủy</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
